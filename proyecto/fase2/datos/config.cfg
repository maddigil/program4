# config.cfg - Configuracion de Euskokar
# Usada tanto por el servidor como por el cliente

# ── Administrador local ──────────────────
admin_usuario=admin
admin_clave=admin123

# ── Base de datos ────────────────────────
db_path=gipuzkoa.db

# ── Ficheros CSV de datos iniciales ──────
estaciones_csv=datos/estaciones.csv
usuarios_csv=datos/usuarios.csv
vehiculos_csv=datos/vehiculos.csv

# ── Log del sistema ───────────────────────
log_path=datos/server.log

# ── Servidor de sockets ───────────────────
# El cliente usa estos valores para conectarse.
# 127.0.0.1 = misma maquina (localhost)
# Cambia la IP si el servidor esta en otra maquina
servidor_ip=127.0.0.1
servidor_puerto=8080
